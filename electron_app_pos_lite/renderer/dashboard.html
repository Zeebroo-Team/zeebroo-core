<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zeebroo POS Lite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/navbar.css" />
<link rel="stylesheet" href="css/sales.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i class="fa-solid fa-cash-register"></i></span>
      <span class="brand-name">Zeebroo <b>POS Lite</b></span>
    </div>
    <div class="user-menu" id="user-menu"></div>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-text">
        <span class="hero-date" id="hero-date"></span>
        <h1 id="greeting">Welcome back</h1>
        <p>What would you like to do today?</p>
      </div>
      <div class="hero-side">
        <div class="hero-time" id="hero-time"></div>
        <div class="hero-biz"><i class="fa-solid fa-store"></i> <span id="hero-biz">—</span></div>
      </div>
    </section>

    <div class="section-title">
      <span>Workspace</span>
      <span class="section-meta" id="section-meta"></span>
    </div>

    <section class="grid" id="tile-grid"></section>
  </main>

  <div class="toast" id="toast"><i class="fa-solid fa-hourglass-half"></i><span id="toast-text"></span></div>

  <script src="js/lang/si.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/jsbarcode.min.js"></script>
  <script src="js/barcodes.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
