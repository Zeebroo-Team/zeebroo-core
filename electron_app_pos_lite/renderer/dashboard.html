<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zeebroo POS Lite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><i class="fa-solid fa-cash-register"></i> Zeebroo POS Lite</div>
    <div class="who">
      <span>Business: <b id="who-business">—</b></span>
      <span>User: <b id="who-user">—</b></span>
      <button class="icon-btn" id="reload-btn" title="Reload page"><i class="fa-solid fa-rotate-right"></i></button>
      <button class="icon-btn" id="restart-btn" title="Restart app"><i class="fa-solid fa-power-off"></i></button>
      <button class="icon-btn" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </div>

  <div class="hero">
    <h1 id="greeting">Welcome back</h1>
    <p>What would you like to do?</p>
  </div>

  <div class="grid" id="tile-grid"></div>

  <div class="toast" id="toast"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
