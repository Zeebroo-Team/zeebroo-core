name: zeebroo_mobile
description: "Zeebroo — mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1

  # Saved-sale receipt export and system printing/sharing
  pdf: ^3.13.1
  printing: ^5.15.1
  intl: ^0.20.2

  # HTTP
  dio: ^5.7.0

  # Picking an image from the gallery (e.g. business logo upload)
  image_picker: ^1.1.2

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Barcode rendering for the Inventory > Barcodes tab
  barcode_widget: ^2.0.4

  # DEV MOBILE PREVIEW — shows a phone frame when running in a browser.
  # Remove this dependency (and its usage in lib/main.dart) once development is done.
  device_preview: ^1.2.0
  mobile_scanner: ^7.4.2
  flutter_contacts: ^2.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: ReceiptMono
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/images/signup/
    - assets/sounds/beep.wav
    - assets/fonts/
