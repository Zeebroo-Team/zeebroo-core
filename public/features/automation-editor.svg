<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#fffbeb"/>
  <rect x="20" y="20" width="360" height="260" rx="24" fill="url(#ag)" opacity=".18"/>
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Flow nodes -->
  <rect x="60" y="110" width="72" height="36" rx="10" fill="#f59e0b" opacity=".85"/>
  <rect x="164" y="80" width="72" height="36" rx="10" fill="#fbbf24" opacity=".75"/>
  <rect x="164" y="140" width="72" height="36" rx="10" fill="#fbbf24" opacity=".75"/>
  <rect x="268" y="110" width="72" height="36" rx="10" fill="#d97706" opacity=".85"/>
  <!-- Connector lines -->
  <line x1="132" y1="128" x2="164" y2="98" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" opacity=".7"/>
  <line x1="132" y1="128" x2="164" y2="158" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" opacity=".7"/>
  <line x1="236" y1="98"  x2="268" y2="128" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" opacity=".7"/>
  <line x1="236" y1="158" x2="268" y2="128" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" opacity=".7"/>
  <!-- Bolt icon centred in trigger node -->
  <text x="96" y="133" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" opacity=".95">⚡</text>
  <!-- Decorative circles -->
  <circle cx="340" cy="50"  r="28" fill="#f59e0b" opacity=".10"/>
  <circle cx="60"  cy="250" r="20" fill="#d97706" opacity=".08"/>
</svg>
