<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#f0fdfa"/>
  <rect x="20" y="20" width="360" height="260" rx="24" fill="url(#dg)" opacity=".18"/>
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Terminal window frame -->
  <rect x="60" y="72" width="280" height="166" rx="14" fill="#0f766e" opacity=".12"/>
  <rect x="60" y="72" width="280" height="28"  rx="14" fill="#0f766e" opacity=".22"/>
  <!-- Traffic light dots -->
  <circle cx="84"  cy="86" r="5" fill="#ef4444" opacity=".7"/>
  <circle cx="100" cy="86" r="5" fill="#f59e0b" opacity=".7"/>
  <circle cx="116" cy="86" r="5" fill="#22c55e" opacity=".7"/>
  <!-- Code lines -->
  <rect x="80"  y="118" width="60"  height="7" rx="3.5" fill="#0f766e" opacity=".45"/>
  <rect x="148" y="118" width="40"  height="7" rx="3.5" fill="#0d9488" opacity=".35"/>
  <rect x="80"  y="134" width="28"  height="7" rx="3.5" fill="#0d9488" opacity=".3"/>
  <rect x="116" y="134" width="80"  height="7" rx="3.5" fill="#0f766e" opacity=".4"/>
  <rect x="80"  y="150" width="100" height="7" rx="3.5" fill="#0f766e" opacity=".38"/>
  <rect x="80"  y="166" width="48"  height="7" rx="3.5" fill="#0d9488" opacity=".3"/>
  <rect x="136" y="166" width="60"  height="7" rx="3.5" fill="#0f766e" opacity=".42"/>
  <rect x="80"  y="182" width="32"  height="7" rx="3.5" fill="#0d9488" opacity=".28"/>
  <!-- Prompt cursor -->
  <rect x="80" y="202" width="10" height="14" rx="2" fill="#0f766e" opacity=".55"/>
  <!-- Decorative circles -->
  <circle cx="340" cy="50"  r="28" fill="#0f766e" opacity=".10"/>
  <circle cx="60"  cy="250" r="20" fill="#0d9488" opacity=".08"/>
</svg>
